name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:    
    runs-on: ubuntu-latest
    env:
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
    steps:
      - name: making job to fail
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6        
        with:
          node-version: '24'
      - name: Install dependencies        
        run: npm install
      - name: Check style        
        run: npm run eslint
      - run: npm test
      - run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Trigger deployment
        id: deployment_step
        if: ${{ github.event_name == 'push' && !contains(join(env.COMMIT_MESSAGES),'#skip') }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Notify discord if deployment success
        if: ${{ steps.deployment_step.conclusion == 'success' }}
        # uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "Hey <@316911818725392384>"
          title: "Deplyment details"
          description: |
          Commit: ${{ github.event.release.tag_name }}
          Message:
          Author:

  tag_release:
    runs-on: ubuntu-latest
    needs: [simple_deployment_pipeline]
    if: ${{ github.event_name == 'push' && !contains(join(toJson(github.event.commits.*.message)),'#skip')}}
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        # uses: anothrNick/github-tag-action@1.75.0
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: v
          DEFAULT_BUMP: patch
          # DRY_RUN: true      